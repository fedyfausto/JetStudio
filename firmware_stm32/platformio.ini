; STM32 F4/F7 firmware: Arduino STM32 core plus LovyanGFX's STM32 SPI driver.
; Same runtime, JetScript VM and device Jet profile (firmware/config) as the ESP32 firmware.
; The per-board environments (debug and release) are in boards.ini, generated by tools/hardware.py.
[platformio]
extra_configs = boards.ini
; src_dir is the repo root, so build_src_filter picks only what the firmware needs.
src_dir = ..

[jet]
platform = ststm32 @ 17.0.0
framework = arduino
lib_deps = symlink://../firmware/components/LovyanGFX
build_src_filter =
    -<*>
    +<firmware_stm32/src/*.cpp>
    +<runtime/runtime.cpp> +<runtime/physics.cpp> +<runtime/particles.cpp> +<runtime/script_host.cpp> +<runtime/pack.cpp>
    +<runtime/script/*.cpp>
    -<runtime/script/js_lexer.cpp> -<runtime/script/js_parser.cpp> -<runtime/script/js_compiler.cpp>
    +<third_party/Jet/src/BlendSpans.cpp> +<third_party/Jet/src/Camera.cpp> +<third_party/Jet/src/Light.cpp>
    +<third_party/Jet/src/Material.cpp> +<third_party/Jet/src/Object.cpp> +<third_party/Jet/src/PostFX.cpp>
    +<third_party/Jet/src/Primitives.cpp> +<third_party/Jet/src/Renderer.cpp> +<third_party/Jet/src/Scene.cpp>
    +<third_party/Jet/src/Sprite2D.cpp> +<third_party/Jet/src/Texture.cpp> +<third_party/Jet/src/TiledSpan.cpp>
    +<third_party/Jet/src/TrigLUT.cpp>
build_unflags = -std=gnu++14 -std=gnu++17 -Os
; -O2: speed over size (the flash has room). Floats in the log need _printf_float.
build_flags = -std=gnu++17 -O2 -fno-math-errno -DJETSCRIPT_NO_COMPILER
    -I src -I ../runtime -I ../runtime/script -I ../firmware/config -I ../third_party/Jet/src
    -Wl,-u,_printf_float
monitor_speed = 115200
