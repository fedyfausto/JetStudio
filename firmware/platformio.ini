; Settings shared by every ESP32 board (ESP-IDF 6.0.1).
; The per-board environments (debug and release) are in boards.ini, generated by tools/hardware.py.
[platformio]
extra_configs = boards.ini

[jet]
platform = espressif32 @ 7.0.1
framework = espidf
board_build.partitions = partitions.csv
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
